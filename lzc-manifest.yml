# app 的唯一 id,上架到商店需要保证不要冲突,尽量使用开发者自己的域名作为后缀.
package: cloud.lazycat.app.xiao.concourse
# app 的版本
version: 0.0.1

# 软件名称,会显示在启动器之类的地方
name: Concourse CI
keyword: concourse,ci,cd,pipeline,devops,automation,continuous-integration,continuous-delivery
description: Concourse 是一个基于容器的自动化系统，使用 Go 语言编写，主要用于持续集成（CI）和持续交付（CD）。

locales:
  zh:
    name: Concourse CI
    description: |
      ## Concourse CI - 现代化的 CI/CD 流水线工具

      **官方网站：** https://concourse-ci.org/
      **仓库地址：** https://github.com/lazycatapps/concourse.git

      Concourse 是一个基于容器的自动化系统，使用 Go 语言编写，主要用于持续集成（CI）和持续交付（CD）。它通过可扩展的流水线（Pipeline）模型来定义和运行各种自动化任务，从最简单的构建脚本到复杂的多阶段部署流程。

      Concourse 的设计理念强调幂等性、不可变性、声明式配置、无状态工作节点和可重现的构建，确保 CI/CD 流程的可靠性和一致性。

      ## 主要功能

      - 🔄 **流水线即代码**：所有工作流都在 YAML 文件中定义，使流水线可版本控制、易于共享
      - 🐳 **容器优先**：原生支持容器技术，所有任务都在 Docker 镜像中运行
      - 📦 **资源抽象**：统一的资源接口，支持 Git、S3、Docker 镜像等多种输入输出
      - 🔧 **强大的调试工具**：内置 `fly execute` 本地运行任务、`fly intercept` 调试容器
      - ♻️ **幂等性保证**：任务设计为短暂且幂等，确保构建的可重现性
      - 🌐 **Web UI**：直观的可视化界面，实时查看流水线状态和任务执行
      - 🔐 **访问控制**：支持多团队管理和精细的权限控制
      - 📊 **并行执行**：自动并行化独立任务，提高构建效率

      ## 使用方法

      1. 访问 Concourse Web UI（默认端口 8080）
      2. 使用默认账号登录：
         - 用户名：`admin`
         - 密码：`admin`

      ## 配置说明

      - **Web UI 端口**：8080
      - **数据库**：PostgreSQL（已内置配置）
      - **Worker 运行时**：containerd
      - **默认用户**：admin/admin（建议生产环境修改）

      ## 快速入门示例

      ```yaml
      jobs:
      - name: hello
        plan:
        - task: test
          config:
            platform: linux
            image_resource:
              type: registry-image
              source:
                # google 镜像仓库下载，网络不好时下载镜像会慢
                repository: ghcr.io/hlesey/busybox
            run:
              path: sh
              args:
              - -c
              - |
                echo -e "\n\nHello, Concourse!\n\nHello, LazyCAT!\n\n"
      ```

      1. 安装 `fly` CLI 工具（从 Web UI 右上角下载）
      2. 登录到 Concourse：`fly -t tutorial login -c <应用地址> -u admin -p admin`
      3. 创建 `pipeline.yml` 定义你的 CI/CD 流水线
      4. 设置流水线：`fly -t tutorial set-pipeline -p my-pipeline -c pipeline.yml`
      5. 启用流水线：`fly -t tutorial unpause-pipeline -p my-pipeline`
      6. 触发流水线执行：`fly -t tutorial trigger-job -j my-pipeline/hello --watch`
      7. 开始使用 Concourse 自动化你的构建和部署流程

      ## 注意事项

      - ⚠️ **资源需求**：Concourse 需要一定的系统资源，建议至少 2GB 内存
      - 🔒 **安全提示**：默认密码为 admin/admin，生产环境请修改环境变量更改密码
      - 📝 **持久化**：数据库数据已配置持久化存储，卸载应用前请注意备份
      - 🌐 **外部 URL**：如需配置外部访问地址，请修改 `CONCOURSE_EXTERNAL_URL` 环境变量

  en:
    name: Concourse CI
    description: |
      ## Concourse CI - Modern CI/CD Pipeline Tool

      **Official Website:** https://concourse-ci.org/
      **Repository:** https://github.com/lazycatapps/concourse.git

      Concourse is a container-based automation system written in Go, primarily used for Continuous Integration (CI) and Continuous Delivery (CD). It uses an extensible Pipeline model to define and run various automation tasks, from simple build scripts to complex multi-stage deployment processes.

      Concourse's design philosophy emphasizes idempotency, immutability, declarative configuration, stateless workers, and reproducible builds, ensuring reliability and consistency in CI/CD processes.

      ## Main Features

      - 🔄 **Pipeline-as-Code**: All workflows defined in YAML files, making pipelines version-controlled and easy to share
      - 🐳 **Container-First**: Native container support, all tasks run inside Docker images
      - 📦 **Resource Abstraction**: Unified resource interface supporting Git, S3, Docker images, and more
      - 🔧 **Powerful Debugging Tools**: Built-in `fly execute` for local task execution, `fly intercept` for container debugging
      - ♻️ **Idempotency Guarantee**: Tasks designed to be ephemeral and idempotent, ensuring build reproducibility
      - 🌐 **Web UI**: Intuitive visual interface for real-time pipeline status and task execution monitoring
      - 🔐 **Access Control**: Multi-team management support with fine-grained permission control
      - 📊 **Parallel Execution**: Automatic parallelization of independent tasks for improved build efficiency

      ## Usage Instructions

      1. Access Concourse Web UI (default port 8080)
      2. Login with default credentials:
         - Username: `admin`
         - Password: `admin`

      ## Configuration

      - **Web UI Port**: 8080
      - **Database**: PostgreSQL (pre-configured)
      - **Worker Runtime**: containerd
      - **Default User**: admin/admin (recommended to change in production)

      ## Quick Start Example

      ```yaml
      jobs:
      - name: hello
        plan:
        - task: test
          config:
            platform: linux
            image_resource:
              type: registry-image
              source:
                # google 镜像仓库下载，网络不好时下载镜像会慢
                repository: ghcr.io/hlesey/busybox
            run:
              path: sh
              args:
              - -c
              - |
                echo -e "\n\nHello, Concourse!\n\nHello, LazyCAT!\n\n"
      ```

      1. Install `fly` CLI tool (download from top-right corner of Web UI)
      2. Login to Concourse: `fly -t tutorial login -c <app-url> -u admin -p admin`
      3. Create `pipeline.yml` to define your CI/CD pipeline
      4. Set pipeline: `fly -t tutorial set-pipeline -p my-pipeline -c pipeline.yml`
      5. Unpause pipeline: `fly -t tutorial unpause-pipeline -p my-pipeline`
      6. Trigger pipeline: `fly -t tutorial trigger-job -j my-pipeline/hello --watch`
      7. Start automating your build and deployment processes with Concourse

      ## Notes

      - ⚠️ **Resource Requirements**: Concourse requires adequate system resources, at least 2GB memory recommended
      - 🔒 **Security Notice**: Default password is admin/admin, please change environment variables in production
      - 📝 **Persistence**: Database data is configured for persistent storage, backup before uninstalling
      - 🌐 **External URL**: To configure external access URL, modify `CONCOURSE_EXTERNAL_URL` environment variable

# 软件本身的 license
license: Apache-2.0

# 软件的主页,会在商店等地方体现
homepage: https://github.com/concourse/concourse

# lpk 的作者,会在商店等地方体现
author: xiao

# application 作为一个特殊的 container 运行，对应的 service 名称为固定的`app`， 其他 service 可以通过此名称与 app 进行通讯
application:
  # 是否存在后台任务， 若存在则系统不会对此 app 进行主动休眠等操作
  background_task: true

  # 期望的 app 域名，如果系统中已经有对应域名则会提示用户选择其他域名。 最终 app 分配到的域名以/lzcapp/run/app.subdomain 为准
  subdomain: concourse

  public_path:
    # 应用自身有认证，不需要懒猫认证
    - /

  routes:
    - /=http://concourse:8080

  depends_on:
    - concourse-db

  # 是否启用多实例
  multi_instance: false

  # GPU 加速支持
  gpu_accel: false

  # KVM 加速支持
  kvm_accel: false

  # USB 加速支持
  usb_accel: false

services:
  concourse-db:
    # lzc-cli appstore copy-image postgres
    image: registry.lazycat.cloud/xiao/library/postgres:6c1ea64cf53b8f2e
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    environment:
      - POSTGRES_DB=concourse
      - POSTGRES_PASSWORD=concourse_pass
      - POSTGRES_USER=concourse_user
      - PGDATA=/database
      - POSTGRES_HOST_AUTH_METHOD=trust
    binds:
      - /lzcapp/var/postgres:/database
    health_check:
      test:
        - CMD-SHELL
        - pg_isready -U concourse_user -d concourse

  concourse:
    # lzc-cli appstore copy-image concourse/concourse
    image: registry.lazycat.cloud/xiao/concourse/concourse:61e5af4514c68af0
    command: quickstart
    environment:
      - CONCOURSE_POSTGRES_HOST=concourse-db
      - CONCOURSE_POSTGRES_USER=concourse_user
      - CONCOURSE_POSTGRES_PASSWORD=concourse_pass
      - CONCOURSE_POSTGRES_DATABASE=concourse
      - CONCOURSE_EXTERNAL_URL=https://${LAZYCAT_APP_DOMAIN}
      - CONCOURSE_ADD_LOCAL_USER=admin:admin
      - CONCOURSE_MAIN_TEAM_LOCAL_USER=admin
      - CONCOURSE_WORKER_BAGGAGECLAIM_DRIVER=overlay
      - CONCOURSE_CLIENT_SECRET=Y29uY291cnNlLXdlYgo=
      - CONCOURSE_TSA_CLIENT_SECRET=Y29uY291cnNlLXdvcmtlcgo=
      - CONCOURSE_CLUSTER_NAME=local
      - CONCOURSE_WORKER_CONTAINERD_DNS_SERVER=8.8.8.8
      - CONCOURSE_WORKER_RUNTIME=containerd
      - CONCOURSE_ENABLE_PIPELINE_INSTANCES=true
      - CONCOURSE_ENABLE_ACROSS_STEP=true
      - CONCOURSE_ENABLE_RESOURCE_CAUSALITY=true
    depends_on:
      - concourse-db

unsupported_platforms:
  - ios
  - android
